name: Deploy a Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: find src -name "*.js" -exec node --check {} \;

      - name: Ejecutar tests
        run: npm test

      - name: Validar configuración de Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta configurar el secreto RENDER_DEPLOY_HOOK_URL en GitHub."
            exit 1
          fi

      - name: Desplegar en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
